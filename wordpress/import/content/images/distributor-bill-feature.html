<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Distributor bill: feature image (1200x600, 2:1, rendered at 2x = 2400x1200)</title>
<style>
@font-face{font-family:C;font-weight:700;src:url("../../../themes/pharmacy/assets/fonts/campton/campton-700.woff2")}
@font-face{font-family:C;font-weight:600;src:url("../../../themes/pharmacy/assets/fonts/campton/campton-600.woff2")}
@font-face{font-family:C;font-weight:400;src:url("../../../themes/pharmacy/assets/fonts/campton/campton-400.woff2")}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:600px;overflow:hidden;font-family:C,sans-serif;color:#081C2C;background:#F6F8FB;position:relative}
.k{position:absolute;left:72px;top:150px;font:600 15px C;letter-spacing:.14em;text-transform:uppercase;color:#1D4ED8}
h1{position:absolute;left:72px;top:184px;font:700 60px/1.06 C;letter-spacing:-.03em;width:540px}
.bill{position:absolute;left:640px;right:72px;top:118px;background:#fff;border-radius:16px;box-shadow:inset 0 0 0 1px #E2E8F0;padding:24px 30px 10px}
.bill header{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:14px;border-bottom:1.5px solid #081C2C}
.bill header b{font:700 19px C}
.bill header span{font:400 14px C;color:#64748B}
.row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:14px;padding:17px 0;border-bottom:1px solid #E2E8F0;font:400 17px C}
.row:last-child{border-bottom:0}
.row i{width:24px;height:24px;border-radius:50%;background:#CCFBF1;display:grid;place-items:center}
.row i svg{width:14px;height:14px}
.row em{font:600 16px C;font-style:normal;color:#0F766E}
.row.w i{background:#FEF3C7}
.row.w em{color:#B45309}
.tag{position:absolute;right:72px;bottom:26px;font:400 13px C;color:#94A3B8}
</style></head><body>
<p class="k">Purchase</p>
<h1>Check the bill before you enter it</h1>
<div class="bill">
<header><b>Distributor bill</b><span>Sample, not a real bill</span></header>
<div class="row"><i><svg viewBox="0 0 12 12" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 6.5 2.6 2.6L10 3"/></svg></i><span>Batch and expiry match the strip</span><em>Checked</em></div>
<div class="row"><i><svg viewBox="0 0 12 12" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 6.5 2.6 2.6L10 3"/></svg></i><span>Quantity and free quantity</span><em>Checked</em></div>
<div class="row w"><i><svg viewBox="0 0 12 12" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round"><path d="M6 2.5v4M6 9v.2"/></svg></i><span>Rate against the last purchase</span><em>Look again</em></div>
</div>
<div class="tag">Illustration</div>
</body></html>
