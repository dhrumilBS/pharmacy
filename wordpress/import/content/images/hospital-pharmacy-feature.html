<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Hospital pharmacy: feature image (1200x600, 2:1, rendered at 2x = 2400x1200)</title>
<style>
@font-face{font-family:C;font-weight:700;src:url("../../../themes/pharmacy/assets/fonts/campton/campton-700.woff2")}
@font-face{font-family:C;font-weight:600;src:url("../../../themes/pharmacy/assets/fonts/campton/campton-600.woff2")}
@font-face{font-family:C;font-weight:400;src:url("../../../themes/pharmacy/assets/fonts/campton/campton-400.woff2")}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:600px;overflow:hidden;font-family:C,sans-serif;color:#fff;background:linear-gradient(155deg,#0D2A40 0%,#081C2C 62%);position:relative}
.dots{position:absolute;right:-60px;top:-80px;width:420px;height:420px;opacity:.14;background:radial-gradient(#fff 2.4px,transparent 3px) 0 0/22px 22px;-webkit-mask-image:radial-gradient(circle,#000 30%,transparent 70%);mask-image:radial-gradient(circle,#000 30%,transparent 70%)}
.k{position:absolute;left:72px;top:176px;font:600 15px C;letter-spacing:.14em;text-transform:uppercase;color:#93C5FD}
h1{position:absolute;left:72px;top:210px;font:700 64px/1.04 C;letter-spacing:-.03em}
h1 span{color:#5EEAD4}
svg.lines{position:absolute;inset:0}
.card{position:absolute;background:#fff;color:#081C2C;border-radius:18px;box-shadow:0 24px 40px -22px rgba(0,0,0,.6);padding:18px 20px;width:250px;height:132px;top:84px}
.card small{display:block;font:600 11px C;letter-spacing:.12em;text-transform:uppercase;color:#64748B}
.card b{display:block;margin-top:4px;font:700 20px C}
.ward{left:660px}
.opd{left:930px}
.chip{display:inline-block;margin-top:12px;padding:5px 10px;border-radius:8px;background:#EFF6FF;color:#1D4ED8;font:600 12.5px C}
.chip.t{background:#F0FDFA;color:#0F766E}
.bed{position:absolute;right:18px;top:16px;width:64px;height:48px}
.tok{position:absolute;right:20px;top:18px;padding:6px 12px;border:2px dashed #CBD5E1;border-radius:10px;font:700 26px C;color:#2563EB;font-variant-numeric:tabular-nums}
.hub{position:absolute;left:660px;top:300px;width:520px;height:190px;border-radius:20px;background:linear-gradient(160deg,#2563EB,#1D4ED8);box-shadow:0 26px 46px -24px rgba(37,99,235,.8);padding:24px 28px}
.hub small{font:600 11px C;letter-spacing:.12em;text-transform:uppercase;color:#BFDBFE}
.hub b{display:block;margin-top:2px;font:700 28px C}
.hub ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px;font:400 15px C;color:#DBEAFE}
.hub li{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.22);padding-top:8px}
.hub li i{font-style:normal;color:#fff;font-weight:600}
</style></head><body>
<div class="dots"></div>
<p class="k">Hospital pharmacy</p>
<h1>One stock,<br><span>two counters</span></h1>
<svg class="lines" viewBox="0 0 1200 600" fill="none"><path d="M785 216 C785 260 790 280 800 300" stroke="#5EEAD4" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/><path d="M1055 216 C1055 260 1050 280 1040 300" stroke="#5EEAD4" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/></svg>
<div class="card ward"><small>In-patient</small><b>Wards</b><span class="chip">Dose-wise issue</span><svg class="bed" viewBox="0 0 64 48" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6v36M4 30h56v12M60 30V20a8 8 0 0 0-8-8H28v18"/><circle cx="16" cy="20" r="6"/></svg></div>
<div class="card opd"><small>Out-patient</small><b>OPD counter</b><span class="chip t">One queue, one token</span><span class="tok">042</span></div>
<div class="hub"><small>Shared</small><b>One stock</b><ul><li>Nearest expiry first <i>FEFO</i></li><li>Ward and counter <i>one list</i></li></ul></div>
</body></html>
